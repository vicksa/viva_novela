services:
  - type: web
    name: viva-novela-api
    runtime: node
    rootDir: api
    plan: free
    buildCommand: npm install
    startCommand: node src/seed/seedIfEmpty.js && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: http://localhost:8081,http://localhost:5173,http://localhost:5174,https://viva-novela-admin-kfcb.onrender.com
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false

  - type: web
    name: viva-novela-admin
    runtime: static
    rootDir: admin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://viva-novela-api-kfcb.onrender.com/api
